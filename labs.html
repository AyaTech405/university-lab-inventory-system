<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow - Laboratories</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/lab.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <header class="sidebar">
      <a href="#" class="logo"><img src="img/logo4.png" alt="logo" /></a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"
          ><i class="fas fa-tachometer-alt"></i> Dashboard</a
        >
        <a href="labs.html" class="active"
          ><i class="fas fa-flask"></i> Laboratories</a
        >
        <a href="reports.html"><i class="fas fa-file-pdf"></i> Reports</a>
        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </header>

    <!-- Main content -->
    <section class="dashboard" id="dashboard">
      <h1 class="heading"><span>Laboratories</span> Management</h1>
      <div class="dashboard-container">
        <!-- Labs Panel -->
        <div class="labs-panel">
          <div class="panel-header">
            <h2>Laboratories</h2>
            <button class="btn btn-primary" id="add-lab-btn">
              <i class="fas fa-plus"></i> Add Lab
            </button>
          </div>
          <div class="labs-list" id="labs-list">
            <p class="placeholder">No laboratories added yet</p>
          </div>
        </div>

        <!-- Devices Panel -->
        <div class="devices-panel">
          <div class="panel-header">
            <h2 id="devices-title">Select a Laboratory</h2>
            <button
              class="btn btn-success"
              id="add-device-btn"
              style="display: none"
            >
              <i class="fas fa-plus"></i> Add Device
            </button>
          </div>
          <div class="devices-list" id="devices-list">
            <p class="placeholder">Select a laboratory to view devices</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Modals -->
    <div id="lab-modal" class="modal">
      <div class="modal-content">
        <span class="close" id="close-lab-modal">&times;</span>
        <h3 id="lab-modal-title">Add Laboratory</h3>
        <form id="lab-form">
          <label for="lab-name">Lab Name/Number:</label>
          <input type="text" id="lab-name" required />
          <label for="lab-location">Location:</label>
          <input type="text" id="lab-location" />
          <label for="lab-logiciel">Logiciel:</label>
          <input type="text" id="lab-logiciel" />
          <label for="lab-capacity">Capacity:</label>
          <input type="number" id="lab-capacity" />
          <input type="hidden" id="lab-id" />
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>

    <div id="device-modal" class="modal">
      <div class="modal-content">
        <span class="close" id="close-device-modal">&times;</span>
        <h3 id="device-modal-title">Add Device</h3>
        <form id="device-form">
          <label for="device-name">Device Name:</label>
          <input type="text" id="device-name" required />
          <label for="device-type">Type:</label>
          <input
            type="text"
            id="device-type"
            placeholder="PC, Printer, etc."
            required
          />
          <label for="device-status">Status:</label>
          <select id="device-status">
            <option value="Functional">Functional</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Out of Service">Out of Service</option>
          </select>
          <input type="hidden" id="device-id" />
          <input type="hidden" id="device-lab-id" />
          <button type="submit" class="btn btn-success">Save</button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <div class="credit">
        created by <span>Missaoui Aya</span> | all rights reserved
      </div>
    </footer>

    <script src="js/labs.js"></script>
    <script>
    // Check role and redirect if not logged in
    const role = sessionStorage.getItem("role");
    if (!role) {
      alert("Please login first");
      window.location.href = "index.html";
    }

    // Logout button
    document.getElementById("logout-btn").addEventListener("click", () => {
      sessionStorage.removeItem("role");
      window.location.href = "index.html";
    });
  </script>
  </body>
</html>
